name: Sync to Gitee

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Gitee
        env:
          GITEE_USER: zhiluniao
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          git remote add gitee "https://${GITEE_USER}:${GITEE_TOKEN}@gitee.com/zhiluniao/rust-72-changes.git"
          git push gitee main --tags --force
